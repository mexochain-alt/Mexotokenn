<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEXO Airdrop</title>
    <!-- Load libraries as fast as possible -->
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            text-align: center; 
            padding: 0; 
            margin: 0;
            background: #1a1a1a; 
            color: white; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh; /* صفحه را تمام صفحه می‌کند */
        }
        .container {
            width: 90%;
            max-width: 400px;
        }
        .logo {
            width: 100px;
            height: auto;
            border-radius: 20px;
            margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(0, 230, 118, 0.2);
        }
        h1 {
            font-size: 24px;
            margin: 10px 0;
            color: #00e676;
        }
        p {
            color: #aaaaaa;
            font-size: 14px;
            margin-bottom: 40px;
        }
        /* ایجاد یک فضای مشخص برای دکمه جهت جلوگیری از پرش صفحه */
        #ton-connect-button { 
            width: 100%;
            display: flex;
            justify-content: center;
            min-height: 50px;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="logo.png" alt="MEXO Logo" class="logo">
        <h1>MEXO Airdrop</h1>
        <p>Connect your TON wallet to claim rewards</p>
        
        <div id="ton-connect-button"></div>
    </div>

    <script>
        // فوری اجرا شدن اسکریپت
        (function() {
            const tg = window.Telegram.WebApp;
            tg.expand();

            // تابع اصلی برای راه اندازی
            function initTonConnect() {
                try {
                    const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
                        manifestUrl: 'https://raw.githubusercontent.com/ton-connect/demo-dapp-with-wallet/main/public/tonconnect-manifest.json',
                        buttonRootId: 'ton-connect-button'
                    });

                    tonConnectUI.onStatusChange((wallet) => {
                        if (wallet) {
                            const address = wallet.account.address;
                            console.log("Wallet connected:", address);
                            
                            // ارسال دیتا به ربات با کمی تاخیر برای اطمینان از بسته نشدن
                            setTimeout(() => {
                                tg.sendData(JSON.stringify({
                                    action: 'connect_wallet',
                                    address: address
                                }));
                            }, 1000);
                        }
                    });
                } catch (error) {
                    console.error("TonConnect Error:", error);
                }
            }

            // اگر صفحه لود شده بود، سریع اجرا کن، وگرنه منتظر بمان
            if (document.readyState === 'complete') {
                initTonConnect();
            } else {
                window.addEventListener('load', initTonConnect);
            }
        })();
    </script>
</body>
</html>

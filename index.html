<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MEXO Wallet Connect</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #111111;
    color: #ffffff;
    font-family: Arial, sans-serif;

    display: flex;
    align-items: center;
    justify-content: center;
}

.container {
    width: 92%;
    max-width: 430px;
    text-align: center;
    padding: 18px 15px;
}

.logo {
    width: 70px;
    height: 70px;
    object-fit: contain;
    border-radius: 18px;
    margin-bottom: 8px;
}

h1 {
    font-size: 34px;
    margin: 0 0 6px;
}

.subtitle {
    font-size: 17px;
    color: #dddddd;
    margin-bottom: 16px;
}

#ton-connect {
    display: flex;
    justify-content: center;
}

#connect-button {
    width: 100%;
    max-width: 280px;
    padding: 14px 20px;
    border: none;
    border-radius: 14px;
    background: #ffffff;
    color: #111111;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

#disconnect-button {
    display: none;
    margin: 12px auto 15px;
    padding: 10px 22px;
    border: none;
    border-radius: 12px;
    background: #333333;
    color: #ffffff;
    font-size: 14px;
}

.card {
    background: #1d1d1d;
    border-radius: 14px;
    padding: 13px 15px;
    margin-top: 10px;
}

.label {
    color: #999999;
    font-size: 13px;
    margin-bottom: 6px;
}

.value {
    font-size: 16px;
    word-break: break-all;
}

.security {
    border: 2px solid #f1c40f;
    border-radius: 12px;
    padding: 10px;
    margin-top: 12px;
    font-size: 13px;
    line-height: 1.4;

    animation: securityLight 2s infinite;
}

.security strong {
    display: block;
    font-size: 14px;
    margin-bottom: 3px;
}

@keyframes securityLight {

    0%, 49% {
        border-color: #f1c40f;
        box-shadow: 0 0 7px #f1c40f;
    }

    50%, 99% {
        border-color: #e53935;
        box-shadow: 0 0 7px #e53935;
    }

    100% {
        border-color: #f1c40f;
        box-shadow: 0 0 7px #f1c40f;
    }
}

.copy-box {
    background: #1f8f4d;
    border-radius: 14px;
    padding: 12px;
    margin-top: 10px;

    font-size: 15px;
    font-weight: bold;
    line-height: 1.4;
}

.copy-button {
    margin-top: 8px;
    padding: 9px 18px;
    border: none;
    border-radius: 10px;
    background: #ffffff;
    color: #111111;
    font-size: 14px;
    font-weight: bold;
}

.back-button {
    width: 100%;
    margin-top: 12px;
    padding: 16px 20px;

    border: none;
    border-radius: 15px;

    background: #ffffff;
    color: #111111;

    font-size: 18px;
    font-weight: bold;

    cursor: pointer;
}

.back-button:active {
    transform: scale(0.98);
}

#error {
    display: none;
    margin-top: 10px;
    color: #ff6b6b;
    font-size: 14px;
}

</style>
</head>

<body>

<div class="container">

    <img
        class="logo"
        src="https://mexochain-alt.github.io/Mexotokenn/logo.png"
        alt="MEXO">

    <h1>MEXO</h1>

    <div class="subtitle">
        Connect your TON wallet
    </div>

    <button
        id="connect-button"
        type="button">
        🔗 Connect Wallet
    </button>

    <button
        id="disconnect-button"
        type="button">
        Disconnect Wallet
    </button>

    <div id="error"></div>

    <div class="security">

        <strong>🔒 Secure Connection</strong>

        TON Connect is secure.
        MEXO never asks for your recovery phrase or private key.

    </div>

    <div class="card">

        <div class="label">
            WALLET STATUS
        </div>

        <div
            class="value"
            id="wallet-status">
            Not connected
        </div>

    </div>

    <div
        id="copy-box"
        class="copy-box"
        style="display:none;">

        📋 Copy your wallet address
        and paste it into the MEXO bot.

        <br>

        <button
            id="copy-button"
            class="copy-button"
            type="button">
            📋 Copy Address
        </button>

    </div>

    <div class="card">

        <div class="label">
            WALLET ADDRESS
        </div>

        <div
            class="value"
            id="wallet-address">
            —
        </div>

    </div>

    <button
        id="back-button"
        class="back-button"
        type="button"
        style="display:none;">

        ⬅️ BACK TO BOT

    </button>

</div>


<script>

/* ==========================================
   TELEGRAM
   ========================================== */

const tg =
    window.Telegram &&
    window.Telegram.WebApp
        ? window.Telegram.WebApp
        : null;

if (tg) {

    try {
        tg.ready();
    } catch (e) {}

    try {
        tg.expand();
    } catch (e) {}

}


/* ==========================================
   TON CONNECT
   ========================================== */

const MANIFEST_URL =
    "https://mexochain-alt.github.io/Mexotokenn/tonconnect-manifest.json";

const tonConnectUI =
    new TON_CONNECT_UI.TonConnectUI({

        manifestUrl: MANIFEST_URL

    });


/* ==========================================
   ELEMENTS
   ========================================== */

const connectButton =
    document.getElementById("connect-button");

const disconnectButton =
    document.getElementById("disconnect-button");

const status =
    document.getElementById("wallet-status");

const address =
    document.getElementById("wallet-address");

const copyBox =
    document.getElementById("copy-box");

const copyButton =
    document.getElementById("copy-button");

const backButton =
    document.getElementById("back-button");

const errorBox =
    document.getElementById("error");


/* ==========================================
   ERROR
   ========================================== */

function showError(text) {

    errorBox.textContent = text;
    errorBox.style.display = "block";

}

function clearError() {

    errorBox.textContent = "";
    errorBox.style.display = "none";

}


/* ==========================================
   SHOW CONNECTED
   ========================================== */

function showConnected(wallet) {

    if (!wallet || !wallet.account) {
        return;
    }

    const walletAddress =
        wallet.account.address;

    status.textContent =
        "Connected ✅";

    address.textContent =
        walletAddress;

    connectButton.style.display =
        "none";

    disconnectButton.style.display =
        "block";

    copyBox.style.display =
        "block";

    backButton.style.display =
        "block";

}


/* ==========================================
   CONNECT
   ========================================== */

connectButton.addEventListener(
    "click",
    async function() {

        clearError();

        connectButton.disabled =
            true;

        connectButton.textContent =
            "Connecting...";

        status.textContent =
            "Connecting...";

        try {

            const wallet =
                await tonConnectUI.connectWallet();

            if (wallet && wallet.account) {

                showConnected(wallet);

            } else {

                status.textContent =
                    "Not connected";

                connectButton.disabled =
                    false;

                connectButton.textContent =
                    "🔗 Connect Wallet";

            }

        } catch (error) {

            console.error(
                "Wallet connection error:",
                error
            );

            status.textContent =
                "Not connected";

            connectButton.disabled =
                false;

            connectButton.textContent =
                "🔗 Connect Wallet";

            if (
                error &&
                error.message
            ) {

                showError(
                    error.message
                );

            }

        }

    }
);


/* ==========================================
   RESTORE CONNECTION
   ========================================== */

tonConnectUI.onStatusChange(
    function(wallet) {

        if (
            wallet &&
            wallet.account
        ) {

            showConnected(wallet);

        }

    }
);


/* ==========================================
   COPY ADDRESS
   ========================================== */

copyButton.addEventListener(
    "click",
    async function() {

        const walletAddress =
            address.textContent;

        if (
            !walletAddress ||
            walletAddress === "—"
        ) {

            return;

        }

        try {

            await navigator.clipboard.writeText(
                walletAddress
            );

            copyButton.textContent =
                "✅ Copied!";

            setTimeout(
                function() {

                    copyButton.textContent =
                        "📋 Copy Address";

                },
                1500
            );

        } catch (error) {

            showError(
                "Please copy the wallet address manually."
            );

        }

    }
);


/* ==========================================
   DISCONNECT
   ========================================== */

disconnectButton.addEventListener(
    "click",
    async function() {

        try {

            await tonConnectUI.disconnect();

            status.textContent =
                "Not connected";

            address.textContent =
                "—";

            disconnectButton.style.display =
                "none";

            copyBox.style.display =
                "none";

            backButton.style.display =
                "none";

            connectButton.style.display =
                "block";

            connectButton.disabled =
                false;

            connectButton.textContent =
                "🔗 Connect Wallet";

        } catch (error) {

            console.error(
                "Disconnect error:",
                error
            );

        }

    }
);


/* ==========================================
   BACK TO BOT
   ========================================== */

backButton.addEventListener(
    "click",
    function() {

        if (!tg) {
            return;
        }

        try {

            tg.close();

        } catch (error) {

            console.error(
                "Telegram close error:",
                error
            );

        }

    }
);

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>MEXO Wallet Connect</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            background: #111111;
            color: #ffffff;
            font-family: Arial, sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
        }

        .container {
            width: 92%;
            max-width: 400px;
            text-align: center;
            padding: 14px 10px;
        }

        /* LOGO */

        .logo {
            width: 68px;
            height: 68px;
            object-fit: contain;
            border-radius: 17px;
            margin-bottom: 7px;
        }

        h1 {
            font-size: 30px;
            margin: 0 0 5px;
        }

        .subtitle {
            font-size: 16px;
            color: #cccccc;
            margin-bottom: 14px;
        }

        /* CONNECT */

        #connect-button {
            width: 100%;
            max-width: 270px;

            padding: 13px 20px;

            border: none;
            border-radius: 12px;

            background: #ffffff;
            color: #111111;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        #connect-button:disabled {
            opacity: 0.6;
        }

        /* DISCONNECT */

        #disconnect-button {
            display: none;

            margin: 9px auto 12px;

            padding: 8px 18px;

            border: none;
            border-radius: 10px;

            background: #333333;
            color: #ffffff;

            font-size: 13px;

            cursor: pointer;
        }

        /* SECURITY */

        .security {
            border: 1px solid #f1c40f;
            border-radius: 10px;

            padding: 9px 11px;

            margin: 12px 0;

            font-size: 13px;
            line-height: 1.35;

            color: #dddddd;

            animation: securityPulse 2s infinite;
        }

        .security strong {
            color: #ffffff;
            font-size: 14px;
        }

        @keyframes securityPulse {

            0%,
            100% {
                opacity: 1;
                box-shadow: 0 0 8px #f1c40f;
            }

            50% {
                opacity: 0.45;
                box-shadow: 0 0 2px #f1c40f;
            }
        }

        /* STATUS CARD */

        .card {
            background: #1d1d1d;

            border-radius: 12px;

            padding: 12px 13px;

            margin-top: 8px;
        }

        .label {
            color: #888888;

            font-size: 12px;

            margin-bottom: 5px;
        }

        .value {
            font-size: 15px;

            word-break: break-all;
        }

        /* GREEN MESSAGE */

        .copy-instruction {
            display: none;

            background: #1f8f45;

            color: #ffffff;

            border-radius: 10px;

            padding: 10px 11px;

            margin: 9px 0;

            font-size: 14px;

            font-weight: bold;

            line-height: 1.35;
        }

        /* ADDRESS */

        #wallet-address {
            color: #ffffff;

            font-size: 13px;

            line-height: 1.35;

            margin-bottom: 9px;
        }

        /* COPY */

        #copy-button {
            display: none;

            width: 100%;

            padding: 10px;

            border: none;

            border-radius: 9px;

            background: #333333;

            color: #ffffff;

            font-size: 14px;

            cursor: pointer;
        }

        #copy-message {
            display: none;

            margin-top: 6px;

            font-size: 12px;

            color: #8cff8c;
        }

        /* BACK TO BOT */

        #back-button {
            display: none;

            width: 100%;

            margin-top: 10px;

            padding: 11px;

            border: none;

            border-radius: 10px;

            background: #ffffff;

            color: #111111;

            font-size: 14px;

            font-weight: bold;

            cursor: pointer;
        }

        /* ERROR */

        #error {
            display: none;

            margin-top: 7px;

            color: #ff6b6b;

            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="container">

    <!-- LOGO -->

    <img
        class="logo"
        src="https://mexochain-alt.github.io/Mexotokenn/logo.png"
        alt="MEXO">


    <h1>MEXO</h1>


    <div class="subtitle">
        Connect your TON wallet
    </div>


    <!-- CONNECT BUTTON -->

    <button
        id="connect-button"
        type="button">

        🔗 Connect Wallet

    </button>


    <!-- DISCONNECT -->

    <button
        id="disconnect-button"
        type="button">

        Disconnect Wallet

    </button>


    <!-- ERROR -->

    <div id="error"></div>


    <!-- SECURITY -->

    <div class="security">

        <strong>🔒 Secure Connection</strong><br>

        Never share your recovery phrase or private key.

    </div>


    <!-- STATUS -->

    <div class="card">

        <div class="label">
            WALLET STATUS
        </div>

        <div
            class="value"
            id="wallet-status">

            Not connected

        </div>

    </div>


    <!-- GREEN INSTRUCTION -->

    <div
        class="copy-instruction"
        id="copy-instruction">

        📋 Copy your wallet address and paste it in the bot.

    </div>


    <!-- ADDRESS -->

    <div class="card">

        <div class="label">
            WALLET ADDRESS
        </div>

        <div
            class="value"
            id="wallet-address">

            —

        </div>


        <!-- COPY -->

        <button
            id="copy-button"
            type="button">

            📋 Copy Wallet Address

        </button>


        <div id="copy-message">

            ✅ Address copied!

        </div>

    </div>


    <!-- BACK TO BOT -->

    <button
        id="back-button"
        type="button">

        ← Back to Bot

    </button>

</div>


<script>

    /* ==========================================
       TELEGRAM
       ========================================== */

    const tg =
        window.Telegram &&
        window.Telegram.WebApp
            ? window.Telegram.WebApp
            : null;


    if (tg) {

        try {
            tg.ready();
        } catch (e) {}

        try {
            tg.expand();
        } catch (e) {}

    }


    /* ==========================================
       TON CONNECT
       ========================================== */

    const MANIFEST_URL =
        "https://mexochain-alt.github.io/Mexotokenn/tonconnect-manifest.json";


    const tonConnectUI =
        new TON_CONNECT_UI.TonConnectUI({

            manifestUrl: MANIFEST_URL,

            buttonRootId: null

        });


    /* ==========================================
       ELEMENTS
       ========================================== */

    const connectButton =
        document.getElementById("connect-button");

    const disconnectButton =
        document.getElementById("disconnect-button");

    const status =
        document.getElementById("wallet-status");

    const address =
        document.getElementById("wallet-address");

    const copyButton =
        document.getElementById("copy-button");

    const copyMessage =
        document.getElementById("copy-message");

    const copyInstruction =
        document.getElementById("copy-instruction");

    const backButton =
        document.getElementById("back-button");

    const errorBox =
        document.getElementById("error");


    /* ==========================================
       ERROR
       ========================================== */

    function showError(message) {

        errorBox.textContent =
            message;

        errorBox.style.display =
            "block";

    }


    function clearError() {

        errorBox.textContent =
            "";

        errorBox.style.display =
            "none";

    }


    /* ==========================================
       COPY WALLET ADDRESS
       ========================================== */

    copyButton.addEventListener(
        "click",
        async function() {

            const walletAddress =
                address.textContent.trim();


            if (
                !walletAddress ||
                walletAddress === "—"
            ) {

                return;

            }


            try {

                await navigator.clipboard.writeText(
                    walletAddress
                );

            } catch (error) {

                const textarea =
                    document.createElement("textarea");

                textarea.value =
                    walletAddress;

                textarea.style.position =
                    "fixed";

                textarea.style.opacity =
                    "0";

                document.body.appendChild(
                    textarea
                );

                textarea.select();

                document.execCommand(
                    "copy"
                );

                textarea.remove();

            }


            copyMessage.style.display =
                "block";


            setTimeout(
                function() {

                    copyMessage.style.display =
                        "none";

                },
                1800
            );

        }
    );


    /* ==========================================
       BACK TO BOT
       ========================================== */

    backButton.addEventListener(
        "click",
        function() {

            if (!tg) {
                return;
            }

            try {

                tg.close();

            } catch (error) {

                console.error(
                    "Telegram close error:",
                    error
                );

            }

        }
    );


    /* ==========================================
       CONNECT WALLET
       ========================================== */

    connectButton.addEventListener(
        "click",
        async function() {

            clearError();

            connectButton.disabled =
                true;

            connectButton.textContent =
                "Connecting...";

            status.textContent =
                "Connecting...";


            try {

                const wallet =
                    await tonConnectUI.connectWallet();


                if (
                    wallet &&
                    wallet.account
                ) {

                    status.textContent =
                        "Connected ✅";


                    address.textContent =
                        wallet.account.address;


                    disconnectButton.style.display =
                        "inline-block";


                    connectButton.style.display =
                        "none";


                    copyInstruction.style.display =
                        "block";


                    copyButton.style.display =
                        "block";


                    backButton.style.display =
                        "block";

                }

            } catch (error) {

                console.error(
                    "Wallet connection error:",
                    error
                );


                status.textContent =
                    "Not connected";


                connectButton.disabled =
                    false;

                connectButton.textContent =
                    "🔗 Connect Wallet";


                if (
                    error &&
                    error.message
                ) {

                    showError(
                        error.message
                    );

                }

            }

        }
    );


    /* ==========================================
       DISCONNECT
       ========================================== */

    disconnectButton.addEventListener(
        "click",
        async function() {

            try {

                await tonConnectUI.disconnect();


                status.textContent =
                    "Not connected";


                address.textContent =
                    "—";


                copyInstruction.style.display =
                    "none";


                copyButton.style.display =
                    "none";


                copyMessage.style.display =
                    "none";


                backButton.style.display =
                    "none";


                disconnectButton.style.display =
                    "none";


                connectButton.style.display =
                    "inline-block";


                connectButton.disabled =
                    false;

                connectButton.textContent =
                    "🔗 Connect Wallet";


            } catch (error) {

                console.error(
                    "Disconnect error:",
                    error
                );

            }

        }
    );


    /* ==========================================
       RESTORE EXISTING CONNECTION
       ========================================== */

    tonConnectUI.onStatusChange(
        function(wallet) {

            if (
                wallet &&
                wallet.account
            ) {

                status.textContent =
                    "Connected ✅";


                address.textContent =
                    wallet.account.address;


                disconnectButton.style.display =
                    "inline-block";


                connectButton.style.display =
                    "none";


                copyInstruction.style.display =
                    "block";


                copyButton.style.display =
                    "block";


                backButton.style.display =
                    "block";

            }

        }
    );

</script>

</body>
</html>

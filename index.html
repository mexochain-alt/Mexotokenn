<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEXO Airdrop</title>
    <!-- TonConnect UI library -->
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <!-- Telegram WebApp library -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            padding: 20px; 
            background: #1a1a1a; 
            color: white; 
        }
        #ton-connect-button { 
            display: flex; 
            justify-content: center; 
            margin-top: 30px; 
            min-height: 50px;
        }
    </style>
</head>
<body>
    <h1>MEXO Airdrop</h1>
    <p>Please connect your wallet to proceed</p>
    
    <div id="ton-connect-button"></div>

    <script>
        // Wait until the DOM is fully loaded before initializing
        document.addEventListener('DOMContentLoaded', () => {
            const tg = window.Telegram.WebApp;
            tg.expand();

            const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
                manifestUrl: 'https://raw.githubusercontent.com/ton-connect/demo-dapp-with-wallet/main/public/tonconnect-manifest.json',
                buttonRootId: 'ton-connect-button'
            });

            tonConnectUI.onStatusChange((wallet) => {
                if (wallet) {
                    const address = wallet.account.address;
                    tg.sendData(JSON.stringify({
                        action: 'connect_wallet',
                        address: address
                    }));
                }
            });
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEXO Airdrop Connect</title>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background: #1a1a1a; color: white; }
        #ton-connect-button { display: flex; justify-content: center; margin-top: 30px; }
        .status { margin-top: 20px; color: #00e676; font-weight: bold; }
    </style>
</head>
<body>
    <h1>MEXO Airdrop</h1>
    <p>برای دریافت ایردراپ، ابتدا کیف پول خود را متصل کنید</p>
    
    <div id="ton-connect-button"></div>
    <div id="status" class="status"></div>

    <script>
        // مقداردهی اولیه Web App تلگرام
        const tg = window.Telegram.WebApp;
        tg.expand(); // باز شدن صفحه در حالت تمام صفحه

        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://raw.githubusercontent.com/ton-connect/demo-dapp-with-wallet/main/public/tonconnect-manifest.json',
            buttonRootId: 'ton-connect-button'
        });

        // وقتی اتصال موفقیت‌آمیز بود
        tonConnectUI.onStatusChange(async (wallet) => {
            if (wallet) {
                const address = wallet.account.address;
                document.getElementById('status').innerText = "اتصال موفقیت‌آمیز بود!";
                
                // تلاش برای ارسال آدرس به ربات تلگرام
                setTimeout(() => {
                    tg.sendData(JSON.stringify({
                        action: 'connect_wallet',
                        address: address
                    }));
                }, 2000);
            } else {
                document.getElementById('status').innerText = "";
            }
        });
    </script>
</body>
</html>

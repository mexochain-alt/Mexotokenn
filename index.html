<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MEXO Wallet Connect</title>

    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #111111;
            color: #ffffff;
            font-family: Arial, sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 90%;
            max-width: 430px;
            text-align: center;
            padding: 30px 20px;
        }

        h1 {
            font-size: 42px;
            margin: 0 0 12px;
        }

        .subtitle {
            font-size: 18px;
            margin-bottom: 30px;
        }

        #ton-connect {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }

        .card {
            background: #1d1d1d;
            border-radius: 16px;
            padding: 22px 18px;
            margin-top: 18px;
        }

        .label {
            color: #999999;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .value {
            font-size: 16px;
            word-break: break-all;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>MEXO</h1>

        <div class="subtitle">
            Connect your TON wallet
        </div>

        <!-- TON Connect Button -->
        <div id="ton-connect"></div>

        <!-- Connection Status -->
        <div class="card">

            <div class="label">
                WALLET STATUS
            </div>

            <div
                class="value"
                id="wallet-status">
                Not connected
            </div>

        </div>

        <!-- Wallet Address -->
        <div class="card">

            <div class="label">
                WALLET ADDRESS
            </div>

            <div
                class="value"
                id="wallet-address">
                —
            </div>

        </div>

    </div>


    <script>

        const MANIFEST_URL =
            "https://mexochain-alt.github.io/Mexotokenn/tonconnect-manifest.json";


        const tonConnectUI =
            new TON_CONNECT_UI.TonConnectUI({

                manifestUrl: MANIFEST_URL,

                buttonRootId: "ton-connect"

            });


        tonConnectUI.onStatusChange(function(wallet) {

            const status =
                document.getElementById("wallet-status");

            const address =
                document.getElementById("wallet-address");


            if (wallet && wallet.account) {

                status.textContent =
                    "Connected ✅";

                address.textContent =
                    wallet.account.address;

            } else {

                status.textContent =
                    "Not connected";

                address.textContent =
                    "—";

            }

        });

    </script>

</body>
</html>

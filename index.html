<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MEXO Wallet Connect</title>

    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #111111;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 90%;
            max-width: 430px;
            text-align: center;
            padding: 30px 20px;
        }

        .logo {
            width: 100px;
            height: 100px;
            object-fit: contain;
            border-radius: 22px;
            margin-bottom: 18px;
        }

        h1 {
            font-size: 42px;
            margin: 0 0 10px;
        }

        .subtitle {
            font-size: 18px;
            color: #dddddd;
            margin-bottom: 28px;
        }

        #ton-connect {
            display: flex;
            justify-content: center;
            margin-bottom: 25px;
        }

        .security {
            background: #181818;
            border: 1px solid #292929;
            border-radius: 14px;
            padding: 15px;
            margin-bottom: 25px;
            font-size: 14px;
            line-height: 1.5;
            color: #bbbbbb;
        }

        .security strong {
            display: block;
            color: #ffffff;
            font-size: 15px;
            margin-bottom: 5px;
        }

        .card {
            background: #1d1d1d;
            border-radius: 16px;
            padding: 20px 18px;
            margin-top: 16px;
        }

        .label {
            color: #999999;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .value {
            font-size: 16px;
            word-break: break-all;
        }
    </style>
</head>

<body>

    <div class="container">

        <img
            class="logo"
            src="https://mexochain-alt.github.io/Mexotokenn/logo.png"
            alt="MEXO">

        <h1>MEXO</h1>

        <div class="subtitle">
            Connect your TON wallet
        </div>

        <div id="ton-connect"></div>

        <div class="security">
            <strong>🔒 Secure Connection</strong>
            Your wallet connection is handled securely by TON Connect.
            MEXO never asks for your recovery phrase or private key.
        </div>

        <div class="card">

            <div class="label">
                WALLET STATUS
            </div>

            <div
                class="value"
                id="wallet-status">
                Not connected
            </div>

        </div>

        <div class="card">

            <div class="label">
                WALLET ADDRESS
            </div>

            <div
                class="value"
                id="wallet-address">
                —
            </div>

        </div>

    </div>

    <script>

        const MANIFEST_URL =
            "https://mexochain-alt.github.io/Mexotokenn/tonconnect-manifest.json";

        const tonConnectUI =
            new TON_CONNECT_UI.TonConnectUI({

                manifestUrl: MANIFEST_URL,

                buttonRootId: "ton-connect"

            });

        tonConnectUI.onStatusChange(function(wallet) {

            const status =
                document.getElementById("wallet-status");

            const address =
                document.getElementById("wallet-address");

            if (wallet && wallet.account) {

                status.textContent =
                    "Connected ✅";

                address.textContent =
                    wallet.account.address;

            } else {

                status.textContent =
                    "Not connected";

                address.textContent =
                    "—";

            }

        });

    </script>

</body>
</html>
